<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" width="160" height="44" fill="none">
  <!-- iCast Logotipo Horizontal Oficial (Modo Obsidian) -->
  <defs>
    <linearGradient id="logoObs_TL" x1="12" y1="22" x2="22" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B4E59"/>
      <stop offset="100%" stop-color="#6F7380"/>
    </linearGradient>
    <linearGradient id="logoObs_TR" x1="22" y1="10" x2="32" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EDEDEF"/>
      <stop offset="100%" stop-color="#B4B7C2"/>
    </linearGradient>
    <linearGradient id="logoObs_BL" x1="12" y1="22" x2="22" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2026"/>
      <stop offset="100%" stop-color="#2D3039"/>
    </linearGradient>
    <linearGradient id="logoObs_BR" x1="22" y1="34" x2="32" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#383B45"/>
      <stop offset="100%" stop-color="#555866"/>
    </linearGradient>
  </defs>

  <!-- Isotipo Prisma B (Escalado a 32x32 dentro del logo) -->
  <g transform="translate(0, 0)">
    <path d="M22 8L10 22L22 19V8Z" fill="url(#logoObs_TL)"/>
    <path d="M22 8L34 22L22 19V8Z" fill="url(#logoObs_TR)"/>
    <path d="M10 22L22 36V19L10 22Z" fill="url(#logoObs_BL)"/>
    <path d="M34 22L22 36V19L34 22Z" fill="url(#logoObs_BR)"/>
    <path d="M22 8L10 22L22 36L34 22L22 8Z" stroke="#EDEDEF" stroke-width="0.9" stroke-opacity="0.35"/>
    <path d="M22 8V36" stroke="#EDEDEF" stroke-width="1.1" stroke-opacity="0.55"/>
  </g>

  <!-- Tipografía iCast Oficial (Separación 14px, Altura Óptica Alineada) -->
  <text x="44" y="29" font-family="-apple-system, 'LG Smart UI', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.4px">
    <tspan fill="#C8BFAF">i</tspan><tspan fill="#EDEDEF">Cast</tspan>
  </text>
</svg>

