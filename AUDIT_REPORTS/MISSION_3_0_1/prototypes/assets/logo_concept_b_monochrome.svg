<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Concept B: Prisma Monocromático (iCast M3.0.1) -->
  <defs>
    <linearGradient id="facetB_TopLeft" x1="12" y1="24" x2="24" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B4E59"/>
      <stop offset="100%" stop-color="#6F7380"/>
    </linearGradient>
    <linearGradient id="facetB_TopRight" x1="24" y1="10" x2="36" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EDEDEF"/>
      <stop offset="100%" stop-color="#B4B7C2"/>
    </linearGradient>
    <linearGradient id="facetB_BotLeft" x1="12" y1="24" x2="24" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2026"/>
      <stop offset="100%" stop-color="#2D3039"/>
    </linearGradient>
    <linearGradient id="facetB_BotRight" x1="24" y1="38" x2="36" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#383B45"/>
      <stop offset="100%" stop-color="#555866"/>
    </linearGradient>
  </defs>

  <!-- 4 Facetas de Diamante / Prisma Romboide -->
  <!-- Superior Izquierda -->
  <path d="M24 8L10 24L24 21V8Z" fill="url(#facetB_TopLeft)"/>
  <!-- Superior Derecha (Alta Reflexión Platino) -->
  <path d="M24 8L38 24L24 21V8Z" fill="url(#facetB_TopRight)"/>
  <!-- Inferior Izquierda (Sombra Carbono) -->
  <path d="M10 24L24 40V21L10 24Z" fill="url(#facetB_BotLeft)"/>
  <!-- Inferior Derecha (Plata Mineral) -->
  <path d="M38 24L24 40V21L38 24Z" fill="url(#facetB_BotRight)"/>

  <!-- Aristas Especulares de Precisión -->
  <path d="M24 8L10 24L24 40L38 24L24 8Z" stroke="#EDEDEF" stroke-width="1.0" stroke-opacity="0.30"/>
  <path d="M24 8V40" stroke="#EDEDEF" stroke-width="1.2" stroke-opacity="0.50"/>
