<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Concept C: Prisma con Refracción Sutil (iCast M3.0.1) -->
  <defs>
    <!-- Prisma Base -->
    <linearGradient id="facetC_Body" x1="12" y1="38" x2="36" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1C22"/>
      <stop offset="50%" stop-color="#282B34"/>
      <stop offset="100%" stop-color="#3A3E4B"/>
    </linearGradient>

    <!-- Rayo Cálido Champagne Sutil (Izquierda) -->
    <linearGradient id="facetC_WarmRay" x1="8" y1="28" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C8BFAF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C8BFAF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Rayo Cuarzo Frío Sutil (Derecha) -->
    <linearGradient id="facetC_CoolRay" x1="40" y1="28" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93B4D1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#93B4D1" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Haz de Refracción Cálido Izquierdo -->
  <polygon points="24,10 8,30 14,36 24,24" fill="url(#facetC_WarmRay)"/>

  <!-- Haz de Refracción Frío Derecho -->
  <polygon points="24,10 40,30 34,36 24,24" fill="url(#facetC_CoolRay)"/>

  <!-- Cuerpo Central del Prisma Principal -->
  <path d="M24 8L12 36C11.5 37.1 12.3 38.5 13.5 38.5H34.5C35.7 38.5 36.5 37.1 36 36L24 8Z" fill="url(#facetC_Body)"/>

  <!-- Faceta Interior Especular de Separación Óptica -->
  <path d="M24 10L14 36H24V10Z" fill="#FFFFFF" fill-opacity="0.08"/>
  <path d="M24 10L34 36H24V10Z" fill="#C8BFAF" fill-opacity="0.12"/>

  <!-- Arista de Refracción Central y Borde -->
  <line x1="24" y1="8" x2="24" y2="38.5" stroke="#EDEDEF" stroke-width="1.2" stroke-opacity="0.6"/>
  <path d="M24 8L12 36M24 8L36 36" stroke="#EDEDEF" stroke-width="1.0" stroke-opacity="0.3"/>
</svg>

